<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Métricas del Embudo - TDAH Productivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f3f4f6; }
        .metric-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; }
        .metric-value { font-size: 2rem; font-weight: 800; color: #f97316; margin-top: 10px; }
        .metric-title { font-size: 0.875rem; color: #6b7280; font-weight: 600; text-transform: uppercase; }
        .funnel-step { display: flex; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #e5e7eb; align-items: center; }
        .funnel-step:last-child { border-bottom: none; }
        .step-name { font-weight: 600; color: #374151; }
        .step-count { font-weight: 700; color: #f97316; background: #fff7ed; padding: 4px 12px; border-radius: 99px; }
    </style>
</head>
<body class="p-6">

<div class="max-w-3xl mx-auto">
    <div class="flex justify-between items-center mb-8">
        <div>
            <h1 class="text-3xl font-extrabold text-gray-900">Panel de Métricas</h1>
            <p class="text-gray-500 mt-1">Seguimiento en tiempo real del embudo.</p>
        </div>
        <div class="flex items-center gap-3">
            <input type="date" id="date-selector" class="border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-700 bg-white" onchange="loadMetrics()" title="Dejar en blanco para Todo el Período">
            <button onclick="loadMetrics()" class="bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-lg font-semibold transition-colors flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                Actualizar
            </button>
        </div>
    </div>

    <!-- Visión General -->
    <h2 class="text-xl font-bold text-gray-800 mb-4">Visión General</h2>
    <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-8">
        <div class="metric-card">
            <div class="metric-title">Accedieron a la Página</div>
            <div class="metric-value" id="val-etapa_1">0</div>
        </div>
        <div class="metric-card">
            <div class="metric-title">Iniciaron el Quiz</div>
            <div class="metric-value" id="val-click_start">0</div>
        </div>
        <div class="metric-card">
            <div class="metric-title">Pantalla Preocupante</div>
            <div class="metric-value" id="val-screen_preocupante">0</div>
        </div>
        <div class="metric-card">
            <div class="metric-title">Pantalla Entendemos</div>
            <div class="metric-value" id="val-screen_entendemos">0</div>
        </div>
        <div class="metric-card">
            <div class="metric-title">Llegaron al Resultado</div>
            <div class="metric-value" id="val-pagina_resultado">0</div>
        </div>
    </div>

    <!-- Funil Detalhado -->
    <h2 class="text-xl font-bold text-gray-800 mb-4">Embudo de Preguntas (¿Dónde se están yendo?)</h2>
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden mb-8" id="funnel-container">
        <!-- Injetado via JS -->
        <div class="p-8 text-center text-gray-500">Cargando datos...</div>
    </div>
</div>

<script>
    const baseNamespace = 'plannertdah_metrics_v3';
    
    // Lista de métricas que queremos buscar
    const metricsToFetch = [
        'etapa_1', 'click_start', 'etapa_2', 'etapa_3', 'etapa_4', 'etapa_5', 
        'etapa_6', 'screen_preocupante', 'screen_entendemos', 
        'etapa_7', 'etapa_8', 'etapa_9', 'etapa_10', 'pagina_resultado'
    ];

    const metricLabels = {
        'etapa_1': 'Visitaron la Página Inicial',
        'click_start': '>>> Hicieron clic en Iniciar Quiz',
        'etapa_2': '1. ¿Cuál es su edad?',
        'etapa_3': '3. ¿Cuál es su nombre?',
        'etapa_4': '4. Género',
        'etapa_5': '5. ¿Fue diagnosticado/a?',
        'etapa_6': '6. ¿Cuál es su mayor dificultad?',
        'screen_preocupante': '>> Pantalla Intermedia: "Eso es preocupante"',
        'screen_entendemos': '>> Pantalla Intermedia: "Nosotros entendemos"',
        'etapa_7': '7. ¿La rutina suele tener peleas?',
        'etapa_8': '8. ¿Tiene baja autoestima?',
        'etapa_9': '9. ¿Cómo lo maneja la escuela?',
        'etapa_10': '10. ¿Quieres construir una rutina?',
        'pagina_resultado': '>> PÁGINA DE VENTAS (Resultado)'
    };

    async function fetchMetric(name) {
        const dateInput = document.getElementById('date-selector');
        const selectedDate = dateInput && dateInput.value ? dateInput.value : 'all';
        
        try {
            const res = await fetch(`https://api.counterapi.dev/v1/${baseNamespace}_${selectedDate}/${name}/`);
            if (!res.ok) return 0;
            const data = await res.json();
            return data.count || 0;
        } catch (e) {
            return 0;
        }
    }

    async function loadMetrics() {
        const btn = document.querySelector('button');
        btn.innerHTML = 'Cargando...';
        btn.disabled = true;

        const results = {};
        
        // Busca todas as métricas em paralelo
        await Promise.all(metricsToFetch.map(async (name) => {
            results[name] = await fetchMetric(name);
        }));

        // Atualiza Visión General
        if(document.getElementById('val-etapa_1')) document.getElementById('val-etapa_1').innerText = results['etapa_1'];
        if(document.getElementById('val-click_start')) document.getElementById('val-click_start').innerText = results['click_start'];
        if(document.getElementById('val-screen_preocupante')) document.getElementById('val-screen_preocupante').innerText = results['screen_preocupante'];
        if(document.getElementById('val-screen_entendemos')) document.getElementById('val-screen_entendemos').innerText = results['screen_entendemos'];
        if(document.getElementById('val-pagina_resultado')) document.getElementById('val-pagina_resultado').innerText = results['pagina_resultado'];

        // Atualiza Lista do Funil
        let html = '';
        let maxValue = results['etapa_1'] || 1; // Para evitar divisão por zero

        metricsToFetch.forEach(name => {
            let val = results[name] || 0;
            let percent = Math.round((val / maxValue) * 100) || 0;
            let label = metricLabels[name] || name;
            let isHighlight = name.includes('screen') || name.includes('resultado');
            
            html += `
            <div class="funnel-step ${isHighlight ? 'bg-orange-50/50' : ''}">
                <div class="flex-1">
                    <div class="step-name">${label}</div>
                    <div class="w-full bg-gray-200 rounded-full h-1.5 mt-2 overflow-hidden">
                        <div class="bg-orange-500 h-1.5 rounded-full transition-all duration-1000" style="width: ${percent}%"></div>
                    </div>
                </div>
                <div class="ml-4 text-right">
                    <div class="step-count">${val}</div>
                    <div class="text-xs text-gray-400 font-medium mt-1">${percent}%</div>
                </div>
            </div>`;
        });

        document.getElementById('funnel-container').innerHTML = html;

        btn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg> Actualizar';
        btn.disabled = false;
    }

    // Carrega ao abrir a página
    loadMetrics();
</script>

</body>
</html>
